<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRONTLINE – Lobby</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    background:
        linear-gradient(90deg, rgba(5,8,13,.88), rgba(5,8,13,.35)),
        linear-gradient(0deg, #090c11, transparent 65%),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2400&q=90")
        center/cover no-repeat;
}

/* NAVIGATION */

header {
    height: 85px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    background: rgba(7,10,15,.88);
    border-bottom: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
}

.logo {
    font-family: 'Barlow Condensed';
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: #ff542e;
}

nav {
    display: flex;
    height: 100%;
    align-items: center;
    gap: 15px;
}

nav a {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 25px;
    text-decoration: none;
    color: #aeb5be;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    transition: .2s;
}

nav a::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 25px;
    right: 25px;
    height: 3px;
    background: #ff542e;
    transform: scaleX(0);
    transition: .2s;
}

nav a:hover {
    color: white;
}

nav a:hover::after {
    transform: scaleX(1);
}

/* HOME CONTENT */

main {
    position: absolute;
    inset: 85px 0 0 0;
}

.center-content {
    position: absolute;
    left: 9%;
    top: 50%;
    transform: translateY(-50%);
}

.eyebrow {
    color: #ff542e;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 6px;
    margin-bottom: 20px;
}

h1 {
    font-family: 'Barlow Condensed';
    font-size: clamp(90px, 13vw, 165px);
    font-weight: 900;
    line-height: .78;
    letter-spacing: -2px;
}

h1 span {
    display: block;
    color: #ff542e;
}

.description {
    margin-top: 30px;
    color: #bdc3cc;
    font-size: 19px;
    letter-spacing: 1px;
}

/* PLAY BUTTON */

.play-button {
    position: absolute;
    right: 45px;
    bottom: 35px;
    width: 230px;
    height: 68px;
    background: #ff542e;
    border: none;
    color: white;
    font-family: 'Barlow Condensed';
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 4px;
    cursor: pointer;
    clip-path: polygon(0 0, 91% 0, 100% 25%, 100% 100%, 9% 100%, 0 75%);
    transition: .25s;
}

.play-button:hover {
    background: #ff7658;
    transform: translateY(-4px);
    box-shadow: 0 10px 40px rgba(255,84,46,.4);
}

@media(max-width: 650px) {
    header {
        padding: 0 15px;
    }

    .logo {
        font-size: 23px;
    }

    nav {
        gap: 0;
    }

    nav a {
        padding: 0 9px;
        font-size: 12px;
        letter-spacing: 1px;
    }

    nav a::after {
        left: 9px;
        right: 9px;
    }

    .center-content {
        left: 7%;
    }

    .play-button {
        right: 20px;
        bottom: 20px;
        width: 190px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        FRONT<span>LINE</span>
    </div>

    <nav>
        <a href="sammlung.html">GEISTER</a>
        <a href="Override.html">OVERRIDE</a>
        <a href="index.html">SPIELEN</a>
    </nav>

</header>

<main>

    <div class="center-content">

        <div class="eyebrow">WILLKOMMEN ZURÜCK</div>

        <h1>
            FRONT
            <span>LINE.</span>
        </h1>

        <div class="description">
            Dein Schlachtfeld wartet.
        </div>

    </div>

    <button class="play-button" onclick="startGame()">
        SPIELEN →
    </button>

</main>

<script>
function startGame() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
